[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "deployer"
dynamic = ["version"]
description = "OpenTofu infrastructure and deployment tooling for AWS ECS applications"
license = { text = "BSD-3-Clause" }
authors = [{ name = "University of Washington" }]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "dacite>=1.9.2",
    "pyyaml>=6.0",
    "tomli_w>=1.0",
]

[project.scripts]
ci-deploy = "deployer.cli.ci_deploy:main"

[dependency-groups]
dev = [
    # Formatting (local only)
    "black>=24.0",
    "isort>=5.13",
    "ruff",
    # Security scanning (local only). Dependency CVE scanning uses
    # `uv audit` (built into uv). Checkov runs via `uvx checkov` (see
    # Makefile) so its pinned-vulnerable dep tree (aiohttp<3.14, ecdsa)
    # stays out of this project's lock. detect-secrets is the opposite
    # case and belongs *in* the lock: the secrets gate must run a pinned
    # scanner, because a version mismatch against the committed
    # .secrets.baseline makes detect-secrets-hook rewrite it and exit 3
    # (SECURITY.md §8).
    "bandit>=1.7",
    "detect-secrets>=1.5",
    # Code analysis
    "vulture",
    "radon",
    # Type checking. Pinned in the lock rather than run via uvx: `uvx pyright`
    # resolves outside the project environment and reports every third-party
    # import as missing (52 errors vs the real 24 when this was first run).
    "pyright>=1.1",
    # Plan lifecycle: docs/plan, docs/someday-maybe, docs/plan-archive
    # (declared in plan.toml, meanings in docs/PLAN-METHOD.md).
    "fileplan>=0.5.1",
    # Include test dependencies for local dev
    {include-group = "test"},
]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "moto[ecs,ecr,rds,cloudwatch]>=5.0",
    # Pure-Python Postgres driver. Not a runtime dependency of the CLI -- it is
    # here so tests/unit/test_lambda_db_common.py can import the shared Lambda
    # module (modules/lambda-shared/db_common.py) exactly as the bundle does.
    "pg8000>=1.31",
]

[tool.uv]
# Don't auto-include dev dependencies in uv run
default-groups = []

[tool.setuptools.packages.find]
where = ["src"]

# Version derived from git tags (setuptools-scm). Presence of this table
# activates dynamic versioning; no options needed. See claude-meta
# best-practices/PYTHON.md sections 16-17.
[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra --strict-markers --tb=short"
# modules/lambda-shared is on the path so `import db_common` resolves the same
# way it does from a Lambda bundle root (see modules/lambda-shared/db_common.py).
pythonpath = ["src", "modules/lambda-shared"]

[tool.coverage.run]
# One canonical measurement: every first-party Python tree `make lint` covers,
# minus tests/ -- the library, the bin/ CLIs, and the two Lambda bundles the
# unit tests import by path. Because the list lives here and not in `--cov=`
# flags, bare `uv run pytest --cov` and `make test-cov` report the same number.
source = [
    "src",
    "bin",
    "modules/lambda-shared",
    "modules/staging-scheduler/lambda",
]
branch = true

[tool.coverage.report]
# Integration-heavy CLI: most subsystem code is boto3/subprocess wrappers that
# require real AWS credentials, so a high floor would only be reachable by
# mocking AWS to itself. The floor is therefore measured, not aspirational:
# `make test-cov` prints the TOTAL, and the floor sits just under it. Raise it
# when a run clears it; don't lower it without saying here what was removed.
#
# Largest remaining gap: bin/ops.py, the widest CLI in the repo and the only
# bin/ script whose commands are still mostly unpinned. `make test-cov` shows
# its current line; the per-phase history of how the floor got here is in git.
# (re-evaluate-by: 2026-11 review)
fail_under = 81
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
# mdformat owns markdown (make format-docs); "*.md" keeps ruff out of it so two
# formatters never contend over the same file. The two lambda/ paths are
# build-artifact directories full of pip-vendored packages.
extend-exclude = [
    "*.md",
    "modules/db-users/lambda",
    "modules/db-on-shared-rds/lambda",
]

[tool.ruff.lint]
# PLW1514 (text I/O without an explicit encoding) is still a ruff preview rule.
# explicit-preview-rules keeps preview mode from switching on every other
# preview rule at the same time: only preview rules named in `select` run.
preview = true
explicit-preview-rules = true

# Focused rule selection for deployer.
# Excluded categories with rationale (per claude-meta lessons learned):
# - FBT: boolean-trap. Click CLI options use bool flags throughout bin/ scripts;
#   the pattern is established and not a real source of bugs here.
# - TRY: tryceratops. Stylistic suggestions about exception structure that
#   don't add value for this codebase's exception handling style.
# - PLR: pylint refactor / complexity counters. We use mccabe (C90) for
#   complexity instead and avoid the noisy magic-value / too-many-* rules.
select = [
    "A",      # flake8-builtins (shadowing builtins)
    "ARG",    # flake8-unused-arguments
    "B",      # flake8-bugbear (real bugs)
    "BLE",    # flake8-blind-except
    "C90",    # mccabe complexity
    "E",      # pycodestyle errors
    "ERA",    # eradicate (commented-out code)
    "F",      # pyflakes (real bugs: F401, F841, F821, etc.)
    "N",      # pep8-naming
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "UP",     # pyupgrade (modern type hints and syntax)
    "W",      # pycodestyle warnings
    # Selected pylint rules (avoid the complexity-counting ones in PLR)
    "PLC",    # convention
    "PLE",    # error
    "PLW",    # warning
    "PLW1514", # preview: open()/read_text()/write_text() without encoding=
]

[tool.ruff.lint.mccabe]
# Deployer has inherently complex AWS orchestration workflows.
# 15 avoids noise on functions like deploy_service(), run_preflight_checks().
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert in tests
    "ARG001",  # unused args in mock callbacks
    "ARG002",  # unused fixture args
    "PLC0415", # imports inside test functions (lazy/conditional)
    "PLC2701", # private name imports
    "S105",    # hardcoded password (test fixtures)
    "S106",    # hardcoded password kwarg
    "S110",    # try/except/pass OK in test setup/teardown
    "SIM105",  # contextlib.suppress not always clearer in test scaffolding
    "SIM117",  # nested `with` OK in tests for clarity
    "T20",     # print in tests OK
]
"bin/*" = [
    "BLE001",  # CLI scripts catch broad exceptions for graceful error messages
    "E501",    # long Click help strings and f-strings; black is line-length authority
    "PLC0415", # lazy imports inside Click commands for fast CLI startup
    "S603",    # subprocess calls to external tools (tofu, docker, aws) expected
    "S607",    # partial executable paths for CLI tools (tofu, docker) expected
    "T20",     # print is the primary output mechanism for CLI scripts
]
"modules/lambda-shared/*" = [
    # PostgreSQL DDL (CREATE USER, GRANT, ALTER DEFAULT PRIVILEGES) cannot be
    # parameterized, so the SQL is necessarily built by f-string. That is exactly
    # why escape_literal()/escape_identifier() exist. Bandit's equivalent (B608)
    # is already skipped globally in [tool.bandit].
    "S608",    # hardcoded-sql-expression
]
"src/*" = [
    "S603",    # subprocess calls to external tools (tofu, docker, aws) expected
    "S607",    # partial executable paths for CLI tools (tofu, docker) expected
    "T20",     # deployer library outputs status via print (log(), log_ok(), etc.)
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# B101: assert usage (OK in non-test code for internal invariants)
# B608: hardcoded SQL expressions (false positives on f-strings with dict access syntax)
# B603: pairs with ruff S603 per-file-ignore ("src/*", "bin/*" — subprocess calls to
#   external tools (tofu, docker, aws) expected)
# B607: pairs with ruff S607 per-file-ignore ("src/*", "bin/*" — partial executable
#   paths for CLI tools (tofu, docker) expected)
skips = ["B101", "B608", "B603", "B607"]

[tool.pysmelly]
# CLI cmd_* functions are dispatched by Click — public naming is conventional
# scattered-constants: kept by operator ratification (docs/PYSMELLY.md, A07).
# Measured at 6d36aa6 with `pysmelly . --check scattered-constants
# --more-please`, it hides 8 findings — two numeric clusters and six strings:
#   15  the RDS poll cadence (rds.POLL_INTERVAL_SECONDS), the ECS stability
#       poll cadence (StabilityConfig.poll_interval) and a count of
#       autoscaling evaluation periods (SCALE_IN_SUSTAINED_PERIODS) — each
#       already named where it lives; the two cadences are separate waits
#       that need not move together
#   50  three unrelated limits: the init dry-run preview's lines per file, the
#       ops audit's error-event cap per log group, and the migration-failure
#       log tail (docs/PYSMELLY.md, under A07, says which is which)
#   'PATH'  the Click metavar on --deploy-toml and --from-compose
#   "Path to deploy.toml (optional if environment is linked)" — the
#       --deploy-toml help text in three bin/ scripts
#   '  - '      the bullet= style passed to advice_block() by three error blocks
#   'app'       the credential_mode default in three signatures
#   'available' the RDS DBInstanceStatus value, one copy in the separately
#               packaged staging-scheduler Lambda
#   'web'       the conventional name of the web service
# Re-run that command before trusting this list; a new cluster is a finding,
# not something this skip was ratified to hide.
skip = ["internal-only", "scattered-constants"]
# Test setup boilerplate dominates duplicate-blocks findings
exclude = ["tests/"]
