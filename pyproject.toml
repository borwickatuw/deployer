[project]
name = "deployer"
version = "0.1.0"
description = "OpenTofu infrastructure and deployment tooling for AWS ECS applications"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "moto[ecs,ecr,rds,cloudwatch,cognito]>=5.0",
    "vulture",
    "radon",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/deployer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
