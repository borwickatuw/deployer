[project]
name = "deployer"
version = "0.1.0"
description = "OpenTofu infrastructure and deployment tooling for AWS ECS applications"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    # Formatting
    "black>=24.0",
    "isort>=5.13",
    "ruff",
    # Security
    "bandit>=1.7",
    "pip-audit>=2.6",
    # Code analysis
    "vulture",
    "radon",
]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "moto[ecs,ecr,rds,cloudwatch]>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/deployer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]
